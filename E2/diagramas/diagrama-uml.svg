<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #263238; stroke-width: 2; }
      .interface { fill: #e3f2fd; }
      .class { fill: #f8fafc; }
      .main { fill: #fff8e1; }
      .title { font: bold 21px Arial, sans-serif; fill: #102027; text-anchor: middle; }
      .stereotype { font: italic 16px Arial, sans-serif; fill: #455a64; text-anchor: middle; }
      .member { font: 16px Consolas, monospace; fill: #263238; }
      .caption { font: bold 28px Arial, sans-serif; fill: #102027; text-anchor: middle; }
      .relation { fill: none; stroke: #37474f; stroke-width: 2.5; stroke-dasharray: 9 7; }
      .label { font: 15px Arial, sans-serif; fill: #37474f; }
    </style>
    <marker id="triangle" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M 12 7 L 1 1 L 1 13 Z" fill="#ffffff" stroke="#37474f" stroke-width="1.5"/>
    </marker>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 1 1 L 10 6 L 1 11" fill="none" stroke="#37474f" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="1400" height="900" fill="#eef2f5"/>
  <text x="700" y="45" class="caption">Exercício 2 — Sistema de Pagamentos</text>

